name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-unit:
    name: Backend unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11: Frappe v15. 3.14: Frappe v16.
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r tests/requirements.txt
      - run: python -m pytest tests/unit -q

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx vite build --outDir /tmp/wn-build-check --emptyOutDir

  marketplace-audit:
    # Same Semgrep rules Frappe Cloud's Marketplace audit runs; a finding
    # here blocks the Marketplace release, so catch it on the PR instead.
    name: Marketplace security audit (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: frappe/press
          path: .press
          sparse-checkout: press/marketplace/doctype/marketplace_app_audit/checks/semgrep-rules
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install semgrep
      - run: >
          semgrep --config .press/press/marketplace/doctype/marketplace_app_audit/checks/semgrep-rules
          --error --metrics=off --exclude .press .
