[build-system]
requires = ["flit_core >=3.2.0,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "whatsnext"
version = "1.0.0"
description = "Standalone WhatsApp Business messaging hub (Meta Cloud API + Twilio) for ERPNext — templates, scheduling, dashboards, event-driven notifications."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28.0",
]
# Do NOT list "frappe" here — it's provided by the bench environment and
# including it causes Marketplace build failures.

[tool.flit.module]
name = "whatsnext"

[tool.bench.frappe-dependencies]
frappe = ">=14.0.0,<16.0.0"
